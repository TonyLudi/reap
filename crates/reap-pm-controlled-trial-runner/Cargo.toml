[package]
name = "reap-pm-controlled-trial-runner"
version.workspace = true
edition.workspace = true

[[bin]]
name = "reap-pm-controlled-trial-runner"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
libc.workspace = true
nix = { version = "=0.30.1", default-features = false, features = ["net", "socket"] }
reap-pm-core.workspace = true
reap-pm-controlled-trial.workspace = true
reap-pm-controlled-trial-live.workspace = true
reap-pm-state.workspace = true
reap-polymarket-adapter.workspace = true
reap-polymarket-auth.workspace = true
reap-polymarket-chain-source.workspace = true
reap-polymarket-egress-binding.workspace = true
reap-polymarket-live-adapter.workspace = true
reap-polymarket-public-source.workspace = true
reap-polymarket-wire.workspace = true
reap-transport.workspace = true
rustix = { version = "=1.1.4", features = ["fs", "net", "process", "system", "thread"] }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
reap-polymarket-live-adapter = { workspace = true, features = ["loopback-evidence"] }
tempfile = "3"
